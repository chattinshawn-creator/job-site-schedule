<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Site Schedule</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
/* Layout: sticky job-board header, a needs-attention strip, then a month grid with trade-colored spans or a week list of work cards. Edits open in a side sheet. */
:root {
  --bg: #e9edf1;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --ink: #17202a;
  --muted: #5a6775;
  --line: #d3dae2;
  --accent: #1d4fd0;
  --accent-ink: #ffffff;
  --danger: #c0371f;
  --warn: #a96400;
  --ok: #1d7a45;
  --scrim: rgba(12, 18, 26, .45);
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --t-appliances: #6b5b95;
  --t-exterior: #7a6a4f;
  --t-cabinets: #5f8a1f;
  --t-demolition: #5b5f68;
  --t-drywall: #8a68ad;
  --t-electrical: #b98d00;
  --t-flooring: #8c5a2b;
  --t-framing: #c2650f;
  --t-hvac: #0d8585;
  --t-inspection: #20262e;
  --t-insulation: #b0466f;
  --t-masonry: #9a3b2b;
  --t-cleaning: #2f8a6b;
  --t-landscape: #3c7a26;
  --t-painting: #4255b8;
  --t-plumbing: #1f6db0;
  --t-punchout: #a03a9a;
  --t-roofing: #2e4a5c;
  --t-safety: #c03e1f;
  --t-trim: #946b10;
  --t-windows: #2f97cf;
  --insp-silver: #c9ced5;
  --insp-rim: #8e959e;
  --insp-pass: #1e9a4b;
  --insp-fail: #d32f2a;
  --insp-pend: #c98a00;
  --t-other: #6f6878;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171d; --surface: #1a2129; --surface-2: #202832; --ink: #e6ebf0; --muted: #9aa7b4; --line: #303a46;
    --accent: #6f95ff; --accent-ink: #0d1420; --danger: #f07a62; --warn: #e6a640; --ok: #5fc38a; --scrim: rgba(0,0,0,.6);
    --t-appliances: #a99be0; --t-exterior: #c9b48d; --t-cabinets: #9cc95a; --t-demolition: #a5abb6; --t-drywall: #bb9be0; --t-electrical: #e8c440; --t-flooring: #d49a63; --t-framing: #e9954a; --t-hvac: #45c4c0; --t-inspection: #dfe5ec; --t-insulation: #ec8fb2; --t-masonry: #e07a66; --t-cleaning: #6fd0a8; --t-landscape: #80c766; --t-painting: #97a6f2; --t-plumbing: #63a8ec; --t-punchout: #de86d8; --t-roofing: #8fb0c6; --t-safety: #f2876a; --t-trim: #d7b158; --t-windows: #6cc6f2; --t-other: #b8b0c2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171d; --surface: #1a2129; --surface-2: #202832; --ink: #e6ebf0; --muted: #9aa7b4; --line: #303a46;
  --accent: #6f95ff; --accent-ink: #0d1420; --danger: #f07a62; --warn: #e6a640; --ok: #5fc38a; --scrim: rgba(0,0,0,.6);
  --t-appliances: #a99be0; --t-exterior: #c9b48d; --t-cabinets: #9cc95a; --t-demolition: #a5abb6; --t-drywall: #bb9be0; --t-electrical: #e8c440; --t-flooring: #d49a63; --t-framing: #e9954a; --t-hvac: #45c4c0; --t-inspection: #dfe5ec; --t-insulation: #ec8fb2; --t-masonry: #e07a66; --t-cleaning: #6fd0a8; --t-landscape: #80c766; --t-painting: #97a6f2; --t-plumbing: #63a8ec; --t-punchout: #de86d8; --t-roofing: #8fb0c6; --t-safety: #f2876a; --t-trim: #d7b158; --t-windows: #6cc6f2; --t-other: #b8b0c2;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app { max-width: 1240px; margin: 0 auto; display: grid; gap: 14px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); padding-block: 14px 10px; display: grid; gap: 12px; border-bottom: 1px solid var(--line); }
.brand-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1; margin: 0; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.nav { display: flex; align-items: center; gap: 4px; }
.period { font-family: var(--f-display); font-weight: 600; font-size: 22px; margin: 0 8px 0 6px; min-width: 9ch; white-space: nowrap; }
.spacer { flex: 1 1 auto; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; height: 36px; padding: 0 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.icon { width: 36px; padding: 0; justify-content: center; font-size: 18px; line-height: 1; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
.btn.danger.solid { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.select { height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 0 8px; max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; height: 34px; padding: 0 12px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* Banner */
.banner { border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn) 10%, var(--surface)); border-radius: 8px; padding: 10px 14px; font-size: 13px; }

/* Attention strip */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.stat { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px; display: grid; gap: 2px; }
.stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.stat .v { font-family: var(--f-display); font-size: 28px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 12px; color: var(--muted); }
.stat.alert .v { color: var(--danger); }
.stat.warnish .v { color: var(--warn); }
.stat.clickable:hover { border-color: var(--muted); }
.stat:not(.clickable) { cursor: default; }

/* Legend */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--t); display: inline-block; }

/* Trade color binding */
.t-appliances { --t: var(--t-appliances); }
.t-exterior { --t: var(--t-exterior); }
.t-cabinets { --t: var(--t-cabinets); }
.t-demolition { --t: var(--t-demolition); }
.t-drywall { --t: var(--t-drywall); }
.t-electrical { --t: var(--t-electrical); }
.t-flooring { --t: var(--t-flooring); }
.t-framing { --t: var(--t-framing); }
.t-hvac { --t: var(--t-hvac); }
.t-inspection { --t: var(--t-inspection); }
.t-insulation { --t: var(--t-insulation); }
.t-masonry { --t: var(--t-masonry); }
.t-cleaning { --t: var(--t-cleaning); }
.t-landscape { --t: var(--t-landscape); }
.t-painting { --t: var(--t-painting); }
.t-plumbing { --t: var(--t-plumbing); }
.t-punchout { --t: var(--t-punchout); }
.t-roofing { --t: var(--t-roofing); }
.t-safety { --t: var(--t-safety); }
.t-trim { --t: var(--t-trim); }
.t-windows { --t: var(--t-windows); }
.t-other { --t: var(--t-other); }
.bar.t-inspection { border-width: 2px; font-weight: 600; }

/* Month grid */
.month { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.dow div { padding: 6px 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: 28px repeat(3, 24px) 20px; position: relative; }
.week + .week { border-top: 1px solid var(--line); }
.cell { grid-row: 1 / -1; border: 0; border-left: 1px solid var(--line); background: transparent; text-align: left; padding: 4px 6px; display: flex; align-items: flex-start; z-index: 0; min-width: 0; }
.cell:first-of-type { border-left: 0; }
.cell:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.cell.out { background: var(--surface-2); color: var(--muted); }
.cell.past .num { color: var(--muted); }
.num { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; width: 22px; height: 22px; display: inline-grid; place-items: center; border-radius: 999px; }
.cell.today .num { background: var(--accent); color: var(--accent-ink); }
.bar {
  position: relative; z-index: 1; margin: 1px 3px; min-width: 0; border-radius: 5px; border: 1px solid color-mix(in srgb, var(--t) 50%, transparent);
  background: color-mix(in srgb, var(--t) 17%, var(--surface)); color: color-mix(in srgb, var(--t) 65%, var(--ink));
  display: flex; align-items: center; gap: 5px; padding: 0 6px; font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-align: left;
}
.bar:hover { background: color-mix(in srgb, var(--t) 28%, var(--surface)); }
.hdl { position: absolute; top: 0; bottom: 0; width: 9px; cursor: ew-resize; touch-action: none; z-index: 2; }
.hdl.l { left: 0; } .hdl.r { right: 0; }
.hdl::after { content: ""; position: absolute; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: currentColor; opacity: 0; transition: opacity .12s; }
.hdl.l::after { left: 2px; } .hdl.r::after { right: 2px; }
.bar:hover .hdl::after, .hdl:active::after { opacity: .55; }
@media (hover: none) { .hdl::after { opacity: .35; } .hdl { width: 12px; } }
.bar.movable { cursor: grab; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.bar.moving { cursor: grabbing; opacity: .55; }
.bar.armed { outline: 2px solid var(--accent); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px; min-height: 42px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2); }
.chips:focus-within { outline: 2px solid var(--accent); border-color: var(--accent); }
.chip-n { display: inline-flex; align-items: center; gap: 2px; padding: 3px 4px 3px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 500; max-width: 100%; overflow-wrap: anywhere; }
.chip-n button { border: 0; background: transparent; color: var(--muted); font-size: 15px; line-height: 1; width: 22px; height: 22px; border-radius: 50%; }
.chip-n button:hover { color: var(--danger); }
.chips input { flex: 1 1 140px; min-width: 120px; border: 0 !important; background: transparent !important; outline: none !important; min-height: 30px !important; padding: 4px !important; }
.team { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.team b { color: var(--ink); font-weight: 600; }
.cell.drag-on { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.draglbl { position: fixed; z-index: 45; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 6px; pointer-events: none; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
#cmodal .scrim { z-index: 30; }
.cbox { position: fixed; z-index: 31; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100% - 24px)); max-height: calc(100% - 32px); background: var(--surface); border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 18px 50px rgba(0,0,0,.3); overflow: hidden; }
.cbox .sheet-b { overflow-y: auto; }
.csec { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 9px; }
.csum { font-size: 14px; }
.rgroup { display: grid; gap: 6px; }
.ropt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2); cursor: pointer; }
.ropt:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.ropt input { margin: 3px 0 0; accent-color: var(--accent); }
.ropt span { display: grid; gap: 1px; }
.ropt small { color: var(--muted); font-size: 12px; }
.sheet.wide { width: min(780px, 100%); }
.rec { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 9px; flex-wrap: wrap; }
.rec.open { border-color: var(--accent); }
.rec-main { display: grid; gap: 6px; min-width: 0; flex: 1 1 260px; font-size: 13.5px; }
.rec-top { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.rec-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.rec-tags .pill { margin-left: 0; }
.rec-acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.sheet-grip { position: absolute; left: -5px; top: 0; bottom: 0; width: 12px; cursor: ew-resize; touch-action: none; z-index: 3; }
.sheet-grip::after { content: ""; position: absolute; left: 4px; top: 50%; height: 44px; margin-top: -22px; width: 4px; border-radius: 3px; background: var(--muted); opacity: .35; transition: opacity .12s, height .12s; }
.sheet-grip:hover::after, .sheet.resizing .sheet-grip::after { opacity: .8; height: 72px; margin-top: -36px; }
.sheet.resizing { transition: none; user-select: none; }
.sheet-h .acts { display: flex; gap: 6px; }
@media (max-width: 720px) { .sheet-grip, .btn-expand { display: none !important; } .sheet { width: 100% !important; } }
.sheet-b { grid-template-columns: minmax(0, 1fr); }
.sheet-b p { margin: 0; }
.sheet.wide .stats { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.sth { margin: 8px 0 0; font-family: var(--f-display); font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: .01em; }
.tscroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.stbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.stbl th, .stbl td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.stbl th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--surface-2); font-weight: 600; }
.stbl tr:last-child td { border-bottom: 0; }
.stbl .n { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: 12.5px; }
.stbl th.n { font-family: var(--f-body); font-size: 11px; }
.money.over { color: var(--danger); } .money.under { color: var(--ok); }
.bar .code { font-family: var(--f-mono); font-size: 10px; font-weight: 600; letter-spacing: .03em; flex: none; }
.bar .ttl { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bar.cl { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: 0; border-left-style: dashed; }
.bar.cr { border-top-right-radius: 0; border-bottom-right-radius: 0; margin-right: 0; border-right-style: dashed; }
.bar.st-done { opacity: .5; }
.bar.st-done .ttl { text-decoration: line-through; }
.bar.st-delayed { border-color: var(--danger); background-image: repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--danger) 20%, transparent) 5px 8px); }
.bar .live { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.bar .tags, .card-tags { display: inline-flex; gap: 3px; flex: none; }
.tag { font-family: var(--f-mono); font-size: 9px; font-weight: 600; letter-spacing: .03em; padding: 0 3px; border-radius: 3px; line-height: 1.45; background: var(--ink); color: var(--bg); }
.tag.media { background: var(--accent); color: var(--accent-ink); }
.tag.warn { background: var(--warn); color: var(--bg); }
.tag.arch { background: var(--danger); color: #fff; }
.chip.arch { border-color: color-mix(in srgb, var(--danger) 50%, var(--line)); color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, var(--surface)); }
.chip.arch.ok { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, var(--surface)); }
.arch-box { display: grid; gap: 10px; padding: 12px; border: 1px dashed color-mix(in srgb, var(--danger) 40%, var(--line)); border-radius: 8px; }
.arch-state { font-size: 12px; font-weight: 600; }
.arch-state.open { color: var(--danger); } .arch-state.ok { color: var(--ok); }
.deps { display: flex; flex-wrap: wrap; gap: 6px; }
.dep { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 3px 4px 3px 8px; border-radius: 6px; border: 1px solid var(--line); max-width: 100%; overflow-wrap: anywhere; }
.dep.wait { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.dep.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.dep .x { border: 0; background: transparent; font-size: 16px; line-height: 1; padding: 0 4px; color: inherit; }
.waitline { font-size: 12.5px; color: var(--warn); font-weight: 600; overflow-wrap: anywhere; }
.matline .ms { font-weight: 600; }
.matlist { margin: 2px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 12.5px; color: var(--muted); }
.matlist li { display: flex; gap: 6px; flex-wrap: wrap; overflow-wrap: anywhere; }
.matlist .nm { color: var(--ink); }
.ms { font-weight: 600; }
.ms.needed, .ms.ordered { color: var(--warn); }
.ms.delivered { color: var(--ok); }
.mrows { display: grid; gap: 8px; }
.mrow { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, .8fr) minmax(0, 1.2fr) minmax(0, 1.4fr) auto; gap: 6px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.mrow input, .mrow select { width: 100%; min-height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 8px; min-width: 0; }
.mrow input:focus, .mrow select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.mrow .x { border: 0; background: transparent; font-size: 18px; color: var(--muted); width: 30px; height: 36px; }
.mrow .x:hover { color: var(--danger); }
.mhead { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, .8fr) minmax(0, 1.2fr) minmax(0, 1.4fr) 30px; gap: 6px; padding: 0 9px; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.madd { justify-self: start; }
.matline .ms.needed, .matline .ms.ordered { color: var(--warn); }
.matline .ms.delivered { color: var(--ok); }
.idots { display: inline-flex; gap: 3px; align-items: center; margin-left: 4px; height: 22px; flex-wrap: wrap; min-width: 0; }
.idot { width: 18px; height: 18px; display: inline-block; cursor: pointer; border-radius: 50%; flex: none; }
.idot.movable { cursor: grab; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
.idot.moving, .idot.armed { outline: 2px solid var(--accent); outline-offset: 1px; }
.idot svg { display: block; width: 100%; height: 100%; }
.idot:hover { transform: scale(1.12); }
.idot:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.imore { display: none; font-size: 9px; font-weight: 700; color: var(--muted); }
.legend .idot { width: 14px; height: 14px; cursor: default; }
.legend .idot:hover { transform: none; }
.logmark { margin-left: auto; font-family: var(--f-mono); font-size: 9px; font-weight: 600; padding: 1px 4px; border-radius: 3px; border: 1px solid var(--muted); color: var(--muted); line-height: 1.3; }
.cell.today .logmark { border-color: var(--accent); color: var(--accent); }
.logrow { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; flex-wrap: wrap; }
.logrow b { display: block; }
.logrow .hint { display: block; }
.day-h .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.row3 { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; }
.visit-box { display: grid; gap: 10px; padding: 12px; border: 1px dashed var(--line); border-radius: 8px; }
.visit-box .lbl { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
.chip.obs { border-color: var(--ink); color: var(--ink); background: var(--surface); }
.chip.media { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.card-sub a { color: var(--accent); font-weight: 600; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.check-row.plain input { accent-color: var(--accent); }
.media-box { display: grid; gap: 10px; padding: 12px; border: 1px dashed var(--line); border-radius: 8px; }
.legend .tag { display: inline-block; }
.bar .nowo { flex: none; font-family: var(--f-mono); font-size: 9px; border: 1px solid currentColor; border-radius: 3px; padding: 0 2px; line-height: 1.2; opacity: .8; }
.more { grid-row: 5; font-size: 11px; color: var(--muted); padding: 0 8px; pointer-events: none; z-index: 1; white-space: nowrap; overflow: hidden; }

/* Week list */
.weeklist { display: grid; gap: 10px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.day-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.day-h h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 19px; letter-spacing: .01em; }
.day-h h3 small { font-family: var(--f-body); font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 6px; }
.day.today .day-h { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.day.today .day-h h3 { color: var(--accent); }
.day.past { opacity: .88; }
.day-items { padding: 10px; display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.empty-day { color: var(--muted); font-size: 13px; padding: 2px 4px; }

/* Work card */
.card { position: relative; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px 10px 14px; display: grid; gap: 6px; background: var(--surface); cursor: pointer; min-width: 0; overflow: hidden; }
.card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--t); }
.card:hover { border-color: var(--muted); }
.card.st-done { opacity: .7; }
.card-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; border-radius: 5px; padding: 2px 7px; border: 1px solid var(--line); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.trade { background: color-mix(in srgb, var(--t) 15%, var(--surface)); color: color-mix(in srgb, var(--t) 65%, var(--ink)); border-color: color-mix(in srgb, var(--t) 40%, transparent); }
.chip .code { font-family: var(--f-mono); font-size: 10px; }
.chip.sub { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 999px; margin-left: auto; }
.pill.scheduled { color: var(--muted); background: var(--surface-2); }
.pill.progress { color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, var(--surface)); }
.pill.done { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, var(--surface)); }
.pill.delayed { color: var(--danger); background: color-mix(in srgb, var(--danger) 13%, var(--surface)); }
.card-title { font-weight: 600; font-size: 14.5px; overflow-wrap: anywhere; }
.st-done .card-title { text-decoration: line-through; }
.card-meta { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.late { color: var(--danger); font-weight: 600; }
.card-sub { font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.card-sub b { color: var(--ink); font-weight: 600; }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 6px; border-top: 1px dashed var(--line); }
.money { font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; font-size: 13px; }
.money.none { color: var(--muted); font-family: var(--f-body); font-weight: 400; font-size: 12px; }
.wo { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; padding: 3px 8px; border-radius: 6px; }
.wo.missing { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--surface)); }
.wo.has { color: var(--ok); }
.wo input { width: 16px; height: 16px; margin: 0; accent-color: var(--ok); }

/* Empty / loading */
.state { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px 22px; display: grid; gap: 10px; justify-items: start; }
.state h2 { margin: 0; font-family: var(--f-display); font-size: 24px; font-weight: 700; }
.state p { margin: 0; color: var(--muted); max-width: 60ch; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--surface); z-index: 21; display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,.18);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.sheet-h h2 { margin: 0; font-family: var(--f-display); font-size: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: .01em; }
.sheet-b { flex: 1 1 auto; overflow-y: auto; padding: 16px 18px; display: grid; gap: 14px; align-content: start; }
.sheet-f { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--surface-2); }
.sheet-f .left { margin-right: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > label, .field > .lbl { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.field input[type="text"], .field input[type="date"], .field select, .field textarea {
  width: 100%; min-height: 40px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 7px; padding: 8px 10px; min-width: 0;
}
.field textarea { resize: vertical; line-height: 1.45; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.radio-seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.radio-seg label { display: flex; align-items: center; justify-content: center; min-height: 40px; font-weight: 600; cursor: pointer; background: var(--surface-2); }
.radio-seg input { position: absolute; opacity: 0; pointer-events: none; }
.radio-seg input:checked + span { color: var(--accent-ink); }
.radio-seg label:has(input:checked) { background: var(--ink); color: var(--bg); }
.radio-seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.money-in { position: relative; }
.money-in span { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-family: var(--f-mono); }
.money-in input { padding-left: 22px !important; font-family: var(--f-mono); }
.check-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2); font-weight: 600; cursor: pointer; }
.check-row input { width: 18px; height: 18px; accent-color: var(--ok); margin: 0; }
.hint { font-size: 12px; color: var(--muted); }
.err { color: var(--danger); font-size: 13px; font-weight: 500; }
.newproj { display: grid; gap: 10px; padding: 12px; border: 1px dashed var(--line); border-radius: 8px; }
.list { display: grid; gap: 8px; }
.proj { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 9px; }
.proj-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.section-lbl { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 40; font-size: 13px; font-weight: 500; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }

@media (max-width: 720px) {
  .brand h1 { font-size: 26px; }
  .period { font-size: 19px; min-width: 0; }
  .controls .select { flex: 1 1 140px; }
  .week { grid-template-rows: 26px repeat(3, 17px) 16px; }
  .bar { font-size: 10px; padding: 0 3px; margin: 1px 1px; border-radius: 3px; }
  .bar .ttl, .bar .nowo { display: none; }
  .bar .tag { font-size: 0; width: 5px; height: 5px; padding: 0; border-radius: 50%; }
  .checks { grid-template-columns: 1fr; }
  .row3 { grid-template-columns: 1fr 1fr; }
  .mhead { display: none; }
  .mrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 30px; }
  .mrow .mn { grid-column: 1 / 3; }
  .mrow .x { grid-column: 3; grid-row: 1; }
  .mrow .mq { grid-column: 1; } .mrow .ms-sel { grid-column: 2; } .mrow .md { grid-column: 1 / 3; }
  .row3 > :nth-child(2) { grid-column: 1 / -1; grid-row: 1; }
  .idot { width: 13px; height: 13px; }
  .ropt { padding: 7px 8px; }
  .idots .idot ~ .idot { display: none; }
  .imore { display: inline; }
  .idots { gap: 1px; margin-left: 1px; height: 20px; flex-wrap: nowrap; overflow: hidden; }
  .cell { padding: 3px 3px; }
  .logmark { font-size: 0; width: 6px; height: 6px; padding: 0; border-radius: 50%; background: var(--muted); }
  .bar .code { font-size: 9px; }
  .more { font-size: 10px; padding: 0 4px; }
  .num { width: 20px; height: 20px; font-size: 11px; }
  .dow div { padding: 5px 4px; font-size: 10px; letter-spacing: .04em; }
  .row2 { grid-template-columns: 1fr; }
  .day-items { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
.who { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.who b { color: var(--ink); font-weight: 600; }
.banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner.info { border-color: var(--line); background: var(--surface); }
.import-box { display: grid; gap: 8px; padding: 12px; border: 1px dashed var(--line); border-radius: 8px; }
</style>

<body>

<div class="app">
  <header class="top">
    <div class="brand-row">
      <div class="brand">
        <h1>Job Site Schedule</h1>
        <p>Shared work calendar for the project coordinator, site lead and subs</p>
      </div>
      <div class="controls">
        <span class="who" id="who" hidden></span>
        <button class="btn" id="btn-lock" type="button" hidden>Unlock editing</button>
        <button class="btn" id="btn-export" type="button">Export</button>
        <button class="btn" id="btn-stats" type="button">Stats</button>
        <button class="btn" id="btn-projects" type="button">Projects</button>
        <button class="btn primary" id="btn-add" type="button">+ Add work</button>
      </div>
    </div>
    <div class="controls">
      <div class="nav">
        <button class="btn icon" id="btn-prev" type="button" aria-label="Previous">‹</button>
        <button class="btn" id="btn-today" type="button">Today</button>
        <button class="btn icon" id="btn-next" type="button" aria-label="Next">›</button>
        <span class="period" id="period"></span>
      </div>
      <span class="spacer"></span>
      <select class="select" id="f-project" aria-label="Filter by project"></select>
      <select class="select" id="f-trade" aria-label="Filter by category"></select>
      <select class="select" id="f-flag" aria-label="Filter by observed or media"></select>
      <div class="seg" role="group" aria-label="View">
        <button type="button" id="v-month" aria-pressed="true">Month</button>
        <button type="button" id="v-week" aria-pressed="false">Week</button>
      </div>
    </div>
  </header>
  <div id="banner" hidden class="banner"><span id="banner-msg"></span><button class="btn" id="banner-btn" type="button" hidden>Unlock editing</button></div>
  <section class="stats" id="stats" aria-label="Needs attention"></section>
  <div class="legend" id="legend"></div>
  <main id="main"></main>
</div>
<div id="overlay" hidden><div class="scrim" id="scrim"></div><aside class="sheet" id="sheet" role="dialog" aria-modal="true"></aside></div>
<div id="cmodal" hidden><div class="scrim" id="cscrim"></div><div class="cbox" id="cbox" role="dialog" aria-modal="true" aria-label="Schedule change"></div></div>
<div class="draglbl" id="draglbl" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function () {
  "use strict";
  const TRADES = [
    ["appliances", "Appliances", "APPL"],
    ["exterior", "Building Exterior Work", "EXT"],
    ["cabinets", "Cabinets / Counters", "CAB"],
    ["demolition", "Demo / Debris Removal", "DEMO"],
    ["drywall", "Drywall / Plaster Install / Repair", "DRY"],
    ["electrical", "Electric", "ELEC"],
    ["flooring", "Flooring", "FLR"],
    ["framing", "Framing", "FRM"],
    ["hvac", "HVAC", "HVAC"],
    ["inspection", "Inspection", "INSP"],
    ["insulation", "Insulation / Air Seal", "INS"],
    ["masonry", "Interior Masonry / Waterproofing", "MAS"],
    ["cleaning", "Interior Cleaning", "CLN"],
    ["landscape", "Landscape, Hardscape & Fencing", "LAND"],
    ["painting", "Painting", "PNT"],
    ["plumbing", "Plumbing", "PLB"],
    ["punchout", "Punchout", "PUNCH"],
    ["roofing", "Roof", "ROOF"],
    ["safety", "Securing / Safety", "SAFE"],
    ["trim", "Trimout / Doors", "TRIM"],
    ["windows", "Windows", "WIN"],
    ["other", "Other", "OTH"]
  ];
  const INSP_TYPES = [["framing", "Framing"], ["elec_rough", "Electric rough-in"], ["hvac_rough", "HVAC rough-in"], ["plumb_rough", "Plumbing rough-in"], ["insulation", "Insulation"], ["elec_final", "Electric final"], ["hvac_final", "HVAC final"], ["plumb_final", "Plumbing final"], ["building_final", "Building final"]];
  const INSP_TYPE = Object.fromEntries(INSP_TYPES);
  const TRADE = Object.fromEntries(TRADES.map(([k, l, c]) => [k, { label: l, code: c }]));
  const STATUSES = [["scheduled", "Scheduled"], ["progress", "In progress"], ["done", "Done"], ["delayed", "Delayed"]];
  const STATUS = Object.fromEntries(STATUSES);
  const INSPS = [["pending", "Pending"], ["pass", "Passed"], ["fail", "Failed"]];
  const INSP = Object.fromEntries(INSPS);
  const MATS = [["", "Not tracked"], ["needed", "Needed"], ["ordered", "Ordered"], ["delivered", "Delivered"]];
  const MAT = Object.fromEntries(MATS);
  const LANES = 3;
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const MON = MONTHS.map(m => m.slice(0, 3));
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const startOfWeek = d => addDays(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -d.getDay());
  const dayDiff = (a, b) => Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 864e5);
  const todayIso = () => iso(new Date());
  const endOf = t => (t.end && t.end >= t.start) ? t.end : t.start;
  const fmtShort = s => { const d = parse(s); return `${MON[d.getMonth()]} ${d.getDate()}`; };
  const fmtDay = s => { const d = parse(s); return `${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`; };
  const money = n => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: n % 1 ? 2 : 0 }).format(n);
  const isLink = s => typeof s === "string" && /^https:\/\/\S+$/.test(s.trim());
  const spanLabel = t => t.start === endOf(t) ? fmtDay(t.start) : `${fmtShort(t.start)} to ${fmtShort(endOf(t))}`;
  const isInsp = t => t.trade === "inspection";
  const INSP_ICON = {
    pass: '<path d="M6.2 10.4l2.6 2.6 5-5.6" fill="none" stroke="var(--insp-pass)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
    fail: '<path d="M7 7l6 6M13 7l-6 6" fill="none" stroke="var(--insp-fail)" stroke-width="2.4" stroke-linecap="round"/>',
    pending: '<circle cx="5.9" cy="10" r="1.9" fill="var(--insp-pend)"/><circle cx="10" cy="10" r="1.9" fill="var(--insp-pend)"/><circle cx="14.1" cy="10" r="1.9" fill="var(--insp-pend)"/>'
  };
  function inspDot(res, title, onclick, task) {
    const r = INSP_ICON[res] ? res : "pending";
    const movable = !!(task && S.canWrite && S.db);
    const el = h("span", Object.assign({ class: "idot" + (movable ? " movable" : ""), title }, onclick ? { role: "button", tabindex: "0", "aria-label": title,
      onclick: e => { e.stopPropagation(); if (S.suppressClick) return; onclick(); },
      onpointerdown: movable ? e => { e.stopPropagation(); startDrag(e, task, "move"); } : null, onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); onclick(); } } } : { "aria-hidden": "true" }));
    el.innerHTML = '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="var(--insp-silver)" stroke="var(--insp-rim)" stroke-width="1.2"/>' + INSP_ICON[r] + '</svg>';
    return el;
  }
  const isDone = t => t.status === "done" || (isInsp(t) && t.inspResult === "pass");
  const satisfied = isDone;
  const effSt = t => { if (isInsp(t)) { if (t.inspResult === "pass") return "done"; if (t.inspResult === "fail") return "delayed"; } return STATUS[t.status] ? t.status : "scheduled"; };
  const depState = x => isInsp(x) ? "Inspection " + (INSP[x.inspResult] || "Pending").toLowerCase() : (STATUS[x.status] || "Scheduled");
  const waitingOn = t => (Array.isArray(t.dependsOn) ? t.dependsOn : []).map(id => S.tasks.get(id)).filter(x => x && !satisfied(x));
  const needsWO = t => !isInsp(t) && !t.workOrder && !isDone(t);
  const LINE_ST = [["needed", "Needed"], ["ordered", "Ordered"], ["delivered", "Delivered"]];
  const matList = t => Array.isArray(t.materialsList) ? t.materialsList.filter(m => m && m.name)
    : (t.materials ? String(t.materials).split(/\n+/).map(x => x.trim()).filter(Boolean).map(name => ({ name, qty: "", status: t.matStatus || "needed", date: t.matDate || "" })) : []);
  const linePending = m => m.status !== "delivered";
  const matLate = t => !isDone(t) && matList(t).some(m => linePending(m) && (t.start <= iso(addDays(new Date(), 7)) || (m.date && m.date > t.start)));

  function applySheetW() {
    const sh = $("sheet"), w = savedSheetW();
    sh.style.width = w ? `min(${Math.min(w, window.innerWidth - 24)}px, 100%)` : "";

  }

  function startSheetResize(e) {
    e.preventDefault();
    const sh = $("sheet"); sh.classList.add("resizing");

      const w = Math.max(MIN_SHEET, Math.min(window.innerWidth - 24, window.innerWidth - ev.clientX));

    const up = () => {
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up);
      sh.classList.remove("resizing");
      const w = Math.round(sh.getBoundingClientRect().width);

  // ---------- import ----------
  async function importFile(file, out) {
    out.textContent = "";
    let j;
    try { j = JSON.parse(await file.text()); } catch (e) { out.textContent = "That file isn't a schedule export. Pick the .json file you were sent."; return; }
    const groups = [["projects", j.projects], ["tasks", j.tasks], ["logs", j.logs]];
    let n = 0, skipped = 0;
    try {
      let batch = S.db.batch(), inBatch = 0;
      for (const [col, rows] of groups) {
        for (const r of (Array.isArray(rows) ? rows : [])) {
          if (!r || typeof r.id !== "string" || !/^[A-Za-z0-9_-]{1,100}$/.test(r.id) || !r.data || typeof r.data !== "object") { skipped++; continue; }
          if (S[col].has(r.id)) { skipped++; continue; }
          batch.set(S.db.collection(col).doc(r.id), r.data); n++; inBatch++;
          if (inBatch >= 400) { await batch.commit(); batch = S.db.batch(); inBatch = 0; }
        }
      }
      if (inBatch) await batch.commit();
      out.textContent = `Imported ${n} item${n === 1 ? "" : "s"}` + (skipped ? `, skipped ${skipped} already here or unreadable.` : ".");
      toast("Import finished");
    } catch (e) {
      out.textContent = e && e.code === "permission-denied" ? "This device isn't unlocked for editing." : "The import stopped partway. Run it again; items already imported are skipped.";
    }
  }

  function knownNames() {

    for (const t of S.tasks.values()) { add(t.coordinator); add(t.lead); add(t.squadLeader); workersOf(t).forEach(add); subsOf(t).forEach(add); }
    add(S.me);
    return [...set.values()].sort((a, b) => a.localeCompare(b));
  }

  function chipInput(id, names, ro, placeholder, listId) {
    let list = names.slice();
    const wrap = h("div", { class: "chips" });
    const inp = h("input", { type: "text", id, list: listId || "names-dl", placeholder, autocomplete: "off", disabled: ro });
    const draw = () => {
      wrap.replaceChildren(...list.map((n, i) => h("span", { class: "chip-n" }, n,
        ro ? null : h("button", { type: "button", "aria-label": "Remove " + n, onclick: () => { list.splice(i, 1); draw(); inp.focus(); } }, "×"))), ro ? null : inp);
      if (ro && !list.length) wrap.append(h("span", { class: "hint", text: "None listed" }));
    };
    const commit = () => {

      if (e.key === "Enter" || e.key === ",") { e.preventDefault(); if (inp.value.trim()) commit(); }

    wrap.addEventListener("click", e => { if (e.target === wrap) inp.focus(); });
    draw();
    wrap.read = () => { if (inp.value.trim()) commit(); return list.slice(); };
    return wrap;
  }

  // ---------- schedule & budget changes ----------
  const numOrNull = v => (v === "" || v == null || !isFinite(Number(v))) ? null : Number(v);
  const plural = (n, w) => `${n} ${w}${Math.abs(n) === 1 ? "" : "s"}`;
  const rangeTxt = (a, b) => a === b ? fmtShort(a) : `${fmtShort(a)} to ${fmtShort(b)}`;
  const shiftTxt = (n, what) => n === 0 ? "" : `${what} ${plural(Math.abs(n), "day")} ${n > 0 ? "later" : "earlier"}`;
  const ROLE_TXT = { coordinator: "Project coordinator", lead: "Project lead", squad: "Squadron leader", sub: "Subcontractor", disputed: "Disputed", external: "External" };

  // "Tied to" holds a list of roles; older records stored one word.
  function tiedList(e) {
    const v = e && e.tiedTo;
    if (Array.isArray(v)) return v.filter(Boolean);
    if (!v) return [];
    if (v === "both") return ["coordinator", "lead"];
    if (v === "neither") return ["external"];
    return [v];
  }
  const TIED_ORDER = ["coordinator", "lead", "squad", "sub", "disputed", "external"];
  function tiedOptions(names) {
    return [["coordinator", "Project coordinator", names.coord || "No name set for this job"], ["lead", "Project lead", names.lead || "No name set for this job"],
      ["squad", "Squadron leader", names.squad || "No name set for this job"],
      ...(names.showSub ? [["sub", "Subcontractor", names.subs && names.subs.length ? names.subs.join(", ") : "No subcontractor named on this job"]] : []),

  function checkGroup(name, opts, values) {
    const wrap = h("div", { class: "rgroup", role: "group" });

      wrap.append(h("label", { class: "ropt" },
        h("input", { type: "checkbox", name, value: v, checked: values.includes(v) }),
        h("span", null, h("b", { text: l }), sub ? h("small", { text: sub }) : null)));
    }
    wrap.vals = () => [...wrap.querySelectorAll("input:checked")].map(x => x.value).sort((a, b) => TIED_ORDER.indexOf(a) - TIED_ORDER.indexOf(b));
    return wrap;
  }
  function radioGroup(name, opts, value) {
    const wrap = h("div", { class: "rgroup", role: "radiogroup" });
    for (const [v, l, sub] of opts) {
      wrap.append(h("label", { class: "ropt" },
        h("input", { type: "radio", name, value: v, checked: v === value }),
        h("span", null, h("b", { text: l }), sub ? h("small", { text: sub }) : null)));
    }
    wrap.val = () => (wrap.querySelector("input:checked") || {}).value || "";
    return wrap;
  }

  // Resolves to an array of history entries (possibly empty), or null if the person backed out.
  function askChange(cur, nv) {
    const p = S.projects.get(cur.projectId) || {};
    const coord = jobCoord(cur), lead = jobLead(cur), squad = (cur.squadLeader || "").trim(), subs = subsOf(cur);
    const os = cur.start, oe = endOf(cur), ns = nv.start, ne = nv.end && nv.end >= nv.start ? nv.end : nv.start;
    const sS = dayDiff(parse(os), parse(ns)), eS = dayDiff(parse(oe), parse(ne));
    const dChanged = sS !== 0 || eS !== 0;
    const ob = numOrNull(cur.budget), nb = numOrNull(nv.budget);
    const bChanged = ob != null && nb != null && ob !== nb;
    if (!dChanged && !bChanged) return Promise.resolve([]);

    return new Promise(resolve => {
      const box = $("cbox");
      const err = h("div", { class: "err", role: "alert" });
      const tiedOpts = tiedOptions({ coord, lead, squad, subs, showSub: usesSub(cur) });
      const parts = [];
      let dType, dTied, bType, bTied;
      if (dChanged) {
        const later = sS > 0 || eS > 0, earlier = sS < 0 || eS < 0;
        dType = radioGroup("cm-dtype", [["delay", "Unexpected delay", "Work started or will finish later than planned"], ["early", "Unexpected early start", "Work started or will finish sooner than planned"], ["planned", "Planned change", "Not counted in the stats"]], later && !earlier ? "delay" : earlier && !later ? "early" : "");

        const sync = () => { tiedWrap.hidden = dType.val() === "planned"; };
        dType.addEventListener("change", sync);
        parts.push(h("section", { class: "csec" },
          h("div", { class: "csum" }, h("b", { text: "Dates: " }), `${rangeTxt(os, oe)} → ${rangeTxt(ns, ne)}`,
            h("div", { class: "hint", text: [shiftTxt(sS, "Start"), shiftTxt(eS, "End")].filter(Boolean).join(" · ") })),
          h("div", { class: "field" }, h("span", { class: "lbl", text: "What kind of change?" }), dType), tiedWrap));
      }
      if (bChanged) {
        const up = nb > ob;
        bType = radioGroup("cm-btype", [["overrun", "Unexpected cost increase"], ["savings", "Unexpected savings"], ["planned", "Planned change", "Not counted in the stats"]], up ? "overrun" : "savings");
        bTied = checkGroup("cm-btied", tiedOpts, []);
        const tiedWrap = h("div", { class: "field" }, h("span", { class: "lbl", text: "Tied to (choose all that apply)" }), bTied);
        bType.addEventListener("change", () => { tiedWrap.hidden = bType.val() === "planned"; });
        parts.push(h("section", { class: "csec" },
          h("div", { class: "csum" }, h("b", { text: "Budget: " }), `${money(ob)} → ${money(nb)}`,
            h("div", { class: "hint", text: `${nb > ob ? "+" : "−"}${money(Math.abs(nb - ob))}` })),
          h("div", { class: "field" }, h("span", { class: "lbl", text: "What kind of change?" }), bType), tiedWrap));
      }
      const reason = h("textarea", { id: "cm-reason", rows: "2", placeholder: "Optional: what happened (e.g. drywall delivery came 3 days late)" });
      const done = v => { $("cmodal").hidden = true; box.replaceChildren(); S.cmodalCancel = null; resolve(v); };
      const save = h("button", { class: "btn primary", type: "button" }, "Save change");
      save.addEventListener("click", () => {
        err.textContent = "";
        const out = [], at = new Date().toISOString(), r = reason.value.trim();
        const base = { at, by: S.me || "Someone", coordinator: coord, lead, squadLeader: squad, subs: subs.slice(), reason: r };
        if (dChanged) {
          const ty = dType.val(), ti = dTied.vals();
          if (!ty) { err.textContent = "Pick what kind of date change this was."; return; }
          if (ty !== "planned" && !ti.length) { err.textContent = "Check at least one option under Tied to for the date change."; return; }
          if (ti.length === 1 && ti[0] === "disputed") { err.textContent = "Disputed needs the people involved checked too, like Project coordinator and Project lead."; return; }
          out.push({ ...base, kind: "dates", type: ty, tiedTo: ty === "planned" ? [] : ti, from: { start: os, end: oe }, to: { start: ns, end: ne }, startShift: sS, endShift: eS, days: Math.max(Math.abs(sS), Math.abs(eS)) });
        }
        if (bChanged) {
          const ty = bType.val(), ti = bTied.vals();
          if (!ty) { err.textContent = "Pick what kind of budget change this was."; return; }
          if (ty !== "planned" && !ti.length) { err.textContent = "Check at least one option under Tied to for the budget change."; return; }
          if (ti.length === 1 && ti[0] === "disputed") { err.textContent = "Disputed needs the people involved checked too, like Project coordinator and Project lead."; return; }

        h("div", { class: "sheet-f" }, h("button", { class: "btn", type: "button", onclick: () => done(null) }, "Undo change"), save));

  }

  async function commitDates(t, ns, ne) {
    const cur = S.tasks.get(t.id) || t;
    const end = ne === ns ? "" : ne;
    const entries = await askChange(cur, { start: ns, end, budget: cur.budget });
    if (entries === null) { renderAll(); toast("Change undone"); return; }
    await write(() => S.db.doc("tasks/" + t.id).update({ start: ns, end, history: [...(cur.history || []), ...entries], datesSetAt: todayIso(), ...stamp() }), "Schedule updated");
  }

  // ---------- drag to resize ----------
  function startDrag(e, t, edge) {
    if (e.button !== undefined && e.button !== 0) return;
    const moveMode = edge === "move";
    const isTouch = e.pointerType === "touch";
    if (!moveMode) { e.preventDefault(); e.stopPropagation(); }
    const cellAt = (x, y) => { const el = document.elementsFromPoint(x, y).find(c => c.classList && c.classList.contains("cell") && c.dataset.date); return el ? el.dataset.date : null; };
    const os = t.start, oe = endOf(t);
    let ns = os, ne = oe;
    const anchor = moveMode ? cellAt(e.clientX, e.clientY) : null;
    if (moveMode && !anchor) return;
    const bar = e.currentTarget && e.currentTarget.closest ? e.currentTarget.closest(".bar, .idot") : null;
    const x0 = e.clientX, y0 = e.clientY;
    let armed = !(moveMode && isTouch);   // on touch, press and hold before moving so normal scrolling still works
    let active = !moveMode;               // a move only starts once the job has shifted at least a day
    let holdTimer = null;
    const lbl = $("draglbl");
    const paint = () => document.querySelectorAll(".cell[data-date]").forEach(c => c.classList.toggle("drag-on", c.dataset.date >= ns && c.dataset.date <= ne));
    const showLabel = ev => {
      const n = dayDiff(parse(ns), parse(ne)) + 1;
      const off = dayDiff(parse(os), parse(ns));
      lbl.textContent = `${rangeTxt(ns, ne)} · ${plural(n, "day")}` + (moveMode && off ? ` · ${off > 0 ? "+" : "−"}${plural(Math.abs(off), "day")}` : "");
      lbl.hidden = false;
      lbl.style.left = Math.min(window.innerWidth - lbl.offsetWidth - 8, Math.max(8, ev.clientX + 12)) + "px";
      lbl.style.top = Math.max(8, ev.clientY - 44) + "px";
    };
    const blockTouch = ev => { if (armed && moveMode) ev.preventDefault(); };
    const move = ev => {
      if (!armed) {
        if (Math.hypot(ev.clientX - x0, ev.clientY - y0) > 8) cleanup();
        return;
      }
      const di = cellAt(ev.clientX, ev.clientY);
      if (di) {
        if (edge === "start") ns = di > oe ? oe : di;
        else if (edge === "end") ne = di < os ? os : di;
        else {
          const off = dayDiff(parse(anchor), parse(di));
          ns = iso(addDays(parse(os), off)); ne = iso(addDays(parse(oe), off));
          if (off !== 0 && !active) { active = true; if (bar) bar.classList.add("moving"); }
        }
      }
      if (!active) return;
      paint(); showLabel(ev);
    };
    const cleanup = () => {
      clearTimeout(holdTimer);
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", end);
      window.removeEventListener("pointercancel", cancel);
      window.removeEventListener("touchmove", blockTouch);
      lbl.hidden = true;
      if (bar) bar.classList.remove("moving", "armed");
      document.querySelectorAll(".cell.drag-on").forEach(c => c.classList.remove("drag-on"));
    };
    const end = () => {
      cleanup();
      if (active || (moveMode && isTouch && armed)) { S.suppressClick = true; setTimeout(() => { S.suppressClick = false; }, 80); }
      if (active && (ns !== os || ne !== oe)) commitDates(t, ns, ne);
    };
    const cancel = () => { ns = os; ne = oe; active = false; cleanup(); };
    if (!armed) holdTimer = setTimeout(() => {
      armed = true;
      if (bar) bar.classList.add("armed");
      try { navigator.vibrate && navigator.vibrate(12); } catch (err) {}
    }, 350);
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", end);
    window.addEventListener("pointercancel", cancel);
    window.addEventListener("touchmove", blockTouch, { passive: false });
    if (!moveMode) paint();
  }

  // ---------- change records (fix or delete stats) ----------
  const CHANGE_TYPE = { delay: "Unexpected delay", early: "Unexpected early start", planned: "Planned change", overrun: "Unexpected cost increase", savings: "Unexpected savings" };
  const sameEntry = (a, b) => a && b && a.at === b.at && a.kind === b.kind;
  function tiedName(e) {
    return tiedList(e).map(r => r === "coordinator" ? `Coordinator${e.coordinator ? " · " + e.coordinator : ""}`
      : r === "lead" ? `Lead${e.lead ? " · " + e.lead : ""}`
      : r === "squad" ? `Squadron leader${e.squadLeader ? " · " + e.squadLeader : ""}`
      : r === "sub" ? `Subcontractor${Array.isArray(e.subs) && e.subs.length ? " · " + e.subs.join(", ") : ""}`
      : ROLE_TXT[r] || r);
  }
  async function saveHistory(t, mutate, msg) {
    const cur = S.tasks.get(t.id);

    const hist = Array.isArray(cur.history) ? cur.history.slice() : [];
    const upd = mutate(hist, cur);
    if (!upd) { toast("That record changed or was already removed. Check the list and try again."); return false; }
    return write(() => S.db.doc("tasks/" + t.id).update({ ...upd, ...stamp() }), msg);
  }

  function openRecords(startProj, startJob) {
    const sj = startJob && S.tasks.get(startJob);
    let proj = sj ? sj.projectId : startProj && S.projects.has(startProj) ? startProj : (sortedProjects()[0] || {}).id || "";
    let job = sj ? sj.id : "";
    let editing = null; // "taskId|at|kind"
    const draw = () => {
      const projSel = h("select", { class: "select", id: "rc-proj", "aria-label": "Project" }, sortedProjects().map(p => h("option", { value: p.id, text: p.name || "Untitled project" })));

      projSel.addEventListener("change", () => { proj = projSel.value; job = ""; editing = null; draw(); });
      const recCount = t => (Array.isArray(t.history) ? t.history.length : 0);
      const jobList = [...S.tasks.values()].filter(t => t.projectId === proj && (recCount(t) || t.id === job)).sort((a, b) => a.start.localeCompare(b.start));
      if (!jobList.some(t => t.id === job)) job = (jobList[0] || {}).id || "";
      const jobSel = h("select", { class: "select", id: "rc-job", "aria-label": "Job", style: "flex:1 1 220px;min-width:0" },
        jobList.map(t => h("option", { value: t.id, text: `${fmtShort(t.start)} · ${(TRADE[t.trade] || TRADE.other).code} · ${t.title || "Untitled"} (${plural(recCount(t), "record")})` })));
      jobSel.value = job;
      jobSel.addEventListener("change", () => { job = jobSel.value; editing = null; draw(); });
      const recs = [...S.tasks.values()].filter(t => t.id === job && Array.isArray(t.history))
        .flatMap(t => t.history.map(e => ({ t, e }))).filter(r => r.e && r.e.at)
        .sort((a, b) => b.e.at.localeCompare(a.e.at));
      const rows = recs.map(({ t, e }) => {
        const key = `${t.id}|${e.at}|${e.kind}`;
        const when = new Date(e.at).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
        const what = e.kind === "budget"

          : `Dates ${rangeTxt(e.from.start, e.from.end)} → ${rangeTxt(e.to.start, e.to.end)} (${plural(e.days || 0, "day")})`;

          h("div", { class: "rec-top" }, h("b", { text: t.title || "Untitled work" }), h("span", { class: "hint", text: `${when} · by ${personName(e.by)}` })),
          h("div", { text: what }),
          h("div", { class: "rec-tags" },
            h("span", { class: "pill " + (e.type === "planned" ? "scheduled" : e.type === "delay" || e.type === "overrun" ? "delayed" : "progress"), text: CHANGE_TYPE[e.type] || e.type || "Unknown" }),
            tiedName(e).map(x => h("span", { class: "chip", text: x }))),
          e.reason ? h("div", { class: "hint", text: "Reason: " + e.reason }) : null,
          e.editedBy ? h("div", { class: "hint", text: `Corrected by ${personName(e.editedBy)}` }) : null);
        if (!S.canWrite || !S.db) { row.append(summary); return row; }
        if (editing === key) {
          const typeOpts = e.kind === "budget" ? [["overrun", CHANGE_TYPE.overrun], ["savings", CHANGE_TYPE.savings], ["planned", "Planned change", "Not counted in the stats"]]
            : [["delay", CHANGE_TYPE.delay], ["early", CHANGE_TYPE.early], ["planned", "Planned change", "Not counted in the stats"]];
          const tyG = radioGroup("rc-type", typeOpts, e.type);
          const tiG = checkGroup("rc-tied", tiedOptions({ coord: e.coordinator, lead: e.lead, squad: e.squadLeader, subs: e.subs || [], showSub: t.crew === "sub" || isInsp(t) || tiedList(e).includes("sub") }), tiedList(e));
          const tiW = h("div", { class: "field" }, h("span", { class: "lbl", text: "Tied to (choose all that apply)" }), tiG);
          tiW.hidden = e.type === "planned";
          tyG.addEventListener("change", () => { tiW.hidden = tyG.val() === "planned"; });
          const rs = h("textarea", { id: "rc-reason", rows: "2", value: e.reason || "" });
          const err = h("div", { class: "err", role: "alert" });
          const save = h("button", { class: "btn primary", type: "button" }, "Save correction");
          save.addEventListener("click", async () => {
            const ty = tyG.val(), ti = tiG.vals();
            if (ty !== "planned" && !ti.length) { err.textContent = "Check at least one option under Tied to."; return; }
            if (ti.length === 1 && ti[0] === "disputed") { err.textContent = "Disputed needs the people involved checked too."; return; }
            save.disabled = true;
            const ok = await saveHistory(t, hist => {
              const i = hist.findIndex(x => sameEntry(x, e)); if (i < 0) return null;
              hist[i] = Object.assign({}, hist[i], { type: ty, tiedTo: ty === "planned" ? [] : ti, reason: rs.value.trim(), editedBy: S.me || "Someone", editedAt: new Date().toISOString() });

            }, "Record corrected");
            if (ok) { editing = null; draw(); } else save.disabled = false;
          });
          row.classList.add("open");
          row.append(h("div", { class: "rec-main" }, h("b", { text: t.title || "Untitled work" }), h("div", { text: what }),
            h("div", { class: "field" }, h("span", { class: "lbl", text: "What kind of change?" }), tyG), tiW, field("Reason", rs, "rc-reason"), err,
            h("div", { class: "proj-actions" }, save, h("button", { class: "btn", type: "button", onclick: () => { editing = null; draw(); } }, "Cancel"))));

        }
        const acts = h("div", { class: "rec-acts" });
        const normal = () => acts.replaceChildren(
          h("button", { class: "btn", type: "button", onclick: () => { editing = key; draw(); } }, "Fix"),
          h("button", { class: "btn danger", type: "button", onclick: confirmDel }, "Delete"));
        const confirmDel = () => acts.replaceChildren(
          h("span", { class: "hint", text: "Delete this record from the stats?" }),
          h("button", { class: "btn danger solid", type: "button", onclick: () => saveHistory(t, (hist, cur) => {

          }, "Record deleted") }, "Yes, delete"),
          h("button", { class: "btn", type: "button", onclick: normal }, "Keep"));
        normal();
        row.append(summary, acts);

      });
      const removedCount = [...S.tasks.values()].filter(t => t.id === job).reduce((n, t) => n + (Array.isArray(t.historyRemoved) ? t.historyRemoved.length : 0), 0);
      openSheet("Clear job statistics", h("div", { class: "sheet-b" },
        h("p", { class: "hint", text: "Pick a job to see every schedule or budget change saved for it. Fix a record that was entered wrong, or delete it so it no longer counts in Stats." }),
        S.projects.size ? h("div", { class: "controls" }, projSel, jobList.length ? jobSel : null) : null,
        !jobList.length ? h("div", { class: "hint", text: "No jobs in this project have change records yet." })
          : rows.length ? h("div", { class: "list" }, rows) : h("div", { class: "hint", text: "This job has no change records left." }),
        removedCount ? h("div", { class: "hint", text: `${plural(removedCount, "record")} deleted from this job so far. Deleted records are kept with each job for reference but don't count in Stats.` }) : null),
        h("div", { class: "sheet-f" }, h("button", { class: "btn", type: "button", onclick: openStats }, "Back to Stats")), draw);
    };
    draw();
  }

  // ---------- stats ----------
  function openStats() {
    let proj = S.project, period = "all";
    const draw = () => {
      const today = todayIso();
      const since = period === "90" ? iso(addDays(new Date(), -90)) : period === "365" ? iso(addDays(new Date(), -365)) : period === "year" ? `${new Date().getFullYear()}-01-01` : "";
      const inP = d => !since || (d && d >= since);
      const allItems = [...S.tasks.values()].filter(t => validDate(t.start) && (proj === "all" || t.projectId === proj));

  // ---------- saved names ----------
  function nameUsage(n) {
    const tasks = [...S.tasks.values()].filter(t => jobCoordRaw(t) === n || jobLeadRaw(t) === n || (t.squadLeader || "").trim() === n || workersOf(t).includes(n) || subsOf(t).includes(n));
    const projects = [...S.projects.values()].filter(p => (p.coordinator || "").trim() === n || (p.lead || "").trim() === n);
    return { tasks, projects };
  }
  const jobCoordRaw = t => (t.coordinator || "").trim();
  const jobLeadRaw = t => (t.lead || "").trim();

  // Replace `from` with `to` everywhere it is stored ("" removes it).
  async function replaceName(from, to) {
    const { tasks, projects } = nameUsage(from);
    const swap = v => (v || "").trim() === from ? to : v;
    const ops = [];
    for (const t of tasks) {
      const ws = [];
      for (const w of workersOf(t)) { const v = w === from ? to : w; if (v && !ws.some(x => x.toLowerCase() === v.toLowerCase())) ws.push(v); }
      const upd = { workers: ws, assignee: "", ...stamp() };
      if (jobCoordRaw(t) === from) upd.coordinator = to;
      if (jobLeadRaw(t) === from) upd.lead = to;
      if ((t.squadLeader || "").trim() === from) upd.squadLeader = to;
      if (subsOf(t).includes(from)) { const ss = []; for (const x of subsOf(t)) { const v = x === from ? to : x; if (v && !ss.some(y => y.toLowerCase() === v.toLowerCase())) ss.push(v); } upd.subs = ss; }
      if (Array.isArray(t.history) && to) upd.history = t.history.map(e => Object.assign({}, e, { coordinator: swap(e.coordinator), lead: swap(e.lead), squadLeader: swap(e.squadLeader) }, Array.isArray(e.subs) ? { subs: e.subs.map(x => x === from ? to : x) } : {}));
      ops.push([S.db.doc("tasks/" + t.id), upd]);
    }
    for (const p of projects) {
      const upd = {};
      if ((p.coordinator || "").trim() === from) upd.coordinator = to;
      if ((p.lead || "").trim() === from) upd.lead = to;
      ops.push([S.db.doc("projects/" + p.id), upd]);
    }
    return write(async () => {
      for (let i = 0; i < ops.length; i += 400) {
        const b = S.db.batch();
        for (const [ref, upd] of ops.slice(i, i + 400)) b.update(ref, upd);
        await b.commit();
      }
    }, to ? `Changed "${from}" to "${to}"` : `Removed "${from}"`);
  }

  function openNames() {
    const draw = () => {
      const names = knownNames().filter(n => n !== S.me || nameUsage(n).tasks.length || nameUsage(n).projects.length);
      const rows = names.map(n => {
        const u = nameUsage(n);
        const where = [u.tasks.length ? plural(u.tasks.length, "job") : "", u.projects.length ? plural(u.projects.length, "project") : ""].filter(Boolean).join(", ") || "Not used on any job";
        const row = h("div", { class: "logrow" });
        const normal = () => row.replaceChildren(
          h("div", null, h("b", { text: n }), h("span", { class: "hint", text: where })),
          h("div", { class: "proj-actions" },
            h("button", { class: "btn", type: "button", onclick: fix }, "Fix spelling"),
            h("button", { class: "btn danger", type: "button", onclick: remove }, "Remove")));
        const fix = () => {
          const inp = h("input", { type: "text", class: "select", id: "nm-fix", value: n, autocomplete: "off", style: "flex:1 1 160px;min-width:0" });
          const go = async () => {
            const v = inp.value.trim();
            if (!v || v === n) { normal(); return; }
            await replaceName(n, v);
          };
          inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); if (e.key === "Escape") { e.stopPropagation(); normal(); } });
          row.replaceChildren(h("div", { class: "proj-actions", style: "flex:1 1 auto" }, inp,
            h("button", { class: "btn primary", type: "button", onclick: go }, "Save"),
            h("button", { class: "btn", type: "button", onclick: normal }, "Cancel")),
            h("span", { class: "hint", text: `Changes "${n}" on ${where.toLowerCase()}, including past change records.` }));

          h("span", { class: "hint", text: u.tasks.length || u.projects.length ? `Remove "${n}" from ${where.toLowerCase()}? Past change records keep it.` : `Remove "${n}"?` }),

  $("f-flag").addEventListener("change", e => { S.flag = e.target.value; store("flag", S.flag); renderAll(); });
  $("v-month").addEventListener("click", () => { S.view = "month"; store("view", "month"); renderAll(); });
  $("v-week").addEventListener("click", () => {
    S.view = "week"; store("view", "week");
    const now = new Date(); if (S.cursor.getMonth() === now.getMonth() && S.cursor.getFullYear() === now.getFullYear()) S.cursor = now;
    renderAll();
  });
  $("scrim").addEventListener("click", closeSheet);
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (!$("cmodal").hidden) { if (S.cmodalCancel) S.cmodalCancel(); return; }
    if (!$("overlay").hidden) closeSheet();
  });

  // ---------- boot ----------
  renderAll();
  (async () => {
    const cfg = window.FIREBASE_CONFIG;
    if (!window.firebase || !cfg || !cfg.apiKey || /PASTE/.test(cfg.apiKey)) {
      S.unavailable = true;
      S.unavailableMsg = !window.firebase ? "The page couldn't load its database tools. Check your connection and reload." : "This schedule isn't connected to its database yet. Add the Firebase settings to firebase-config.js.";
      renderAll(); return;
    }
    let db;
    try {
      firebase.initializeApp(cfg);
      db = firebase.firestore();
      S.auth = firebase.auth();
      await S.auth.signInAnonymously();
      S.uid = S.auth.currentUser && S.auth.currentUser.uid;
    } catch (e) {
      S.unavailable = true;
      S.unavailableMsg = "Couldn't connect to the schedule database. Reload the page, and if it keeps happening tell the project coordinator.";
      renderAll(); return;
    }
    S.db = db;
    try {
      const ed = await db.doc("editors/" + S.uid).get();
      S.canWrite = ed.exists;
      if (ed.exists && ed.data().name && !S.me) { S.me = ed.data().name; store("name", S.me); }
    } catch (e) { S.canWrite = false; }
    S.ready = true; renderAll();
    const timer = setTimeout(() => { S.slow = true; renderAll(); }, 10000);
    const clearSlow = () => { if (S.loadedP && S.loadedT) { clearTimeout(timer); S.slow = false; } };
    const onErr = () => { clearTimeout(timer); S.loadedP = S.loadedT = true; S.slow = false; toast("Lost connection to the shared schedule. Reload the page to reconnect."); renderAll(); };
    db.collection("projects").onSnapshot(snap => {
      S.projects = new Map(snap.docs.map(d => [d.id, Object.assign({ id: d.id }, d.data())]));
      if (!snap.metadata.fromCache) S.loadedP = true; clearSlow(); renderAll();
    }, onErr);
    db.collection("tasks").onSnapshot(snap => {
      S.tasks = new Map(snap.docs.map(d => [d.id, Object.assign({ id: d.id }, d.data())]));
      if (!snap.metadata.fromCache) S.loadedT = true; clearSlow(); renderAll();
    }, onErr);
    db.collection("logs").onSnapshot(snap => {
      S.logs = new Map(snap.docs.map(d => [d.id, Object.assign({ id: d.id }, d.data())]));
      if (!snap.metadata.fromCache) S.loadedL = true; renderAll();
    }, () => toast("Daily logs couldn't load. Reload the page to try again."));
  })();
})();
</script>
</body>
</html>
